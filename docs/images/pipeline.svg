<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-label="cADRe pipeline: observe, detect, alert, respond">
  <rect width="1200" height="250" rx="20" fill="#0e1424"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7694"/>
    </marker>
  </defs>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- 1 observe -->
    <rect x="30" y="34" width="250" height="182" rx="16" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="52" y="72" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="1.5">1 · OBSERVE</text>
    <text x="52" y="102" font-size="20" font-weight="700" fill="#e6ebf5">Who is doing what?</text>
    <g font-size="15" fill="#aab4cf">
      <text x="52" y="134">Process list, folders, CPU</text>
      <text x="52" y="158">Agents' own session files</text>
      <text x="52" y="182">Watch-only hooks per event</text>
    </g>
    <line x1="284" y1="125" x2="312" y2="125" stroke="#6b7694" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 detect -->
    <rect x="318" y="34" width="250" height="182" rx="16" fill="#5b7cff" fill-opacity="0.1" stroke="#5b7cff" stroke-opacity="0.65"/>
    <text x="340" y="72" font-size="13" font-weight="700" fill="#9db0ff" letter-spacing="1.5">2 · DETECT</text>
    <text x="340" y="102" font-size="20" font-weight="700" fill="#e6ebf5">Is any of it risky?</text>
    <g font-size="15" fill="#aab4cf">
      <text x="340" y="134">25 rules in 5 categories</text>
      <text x="340" y="158">Commands, scope, secrets,</text>
      <text x="340" y="182">runaway loops, how it runs</text>
    </g>
    <line x1="572" y1="125" x2="600" y2="125" stroke="#6b7694" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 alert -->
    <rect x="606" y="34" width="250" height="182" rx="16" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="628" y="72" font-size="13" font-weight="700" fill="#fcd34d" letter-spacing="1.5">3 · ALERT</text>
    <text x="628" y="102" font-size="20" font-weight="700" fill="#e6ebf5">Tell the person</text>
    <g font-size="15" fill="#aab4cf">
      <text x="628" y="134">Red banner and toast</text>
      <text x="628" y="158">Tray / menu bar notification</text>
      <text x="628" y="182">Alerts tab, police droid</text>
    </g>
    <line x1="860" y1="125" x2="888" y2="125" stroke="#6b7694" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 respond -->
    <rect x="894" y="34" width="276" height="182" rx="16" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-opacity="0.6"/>
    <text x="916" y="72" font-size="13" font-weight="700" fill="#fda4af" letter-spacing="1.5">4 · RESPOND</text>
    <text x="916" y="102" font-size="20" font-weight="700" fill="#e6ebf5">You decide, one click</text>
    <g font-size="15" fill="#aab4cf">
      <text x="916" y="134">Pause · Resume · Kill</text>
      <text x="916" y="158">Mark as a false positive</text>
      <text x="916" y="182">Every action in a response log</text>
    </g>
  </g>
</svg>
